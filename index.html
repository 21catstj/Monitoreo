<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incidencias Sánchez Taboada</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📢</text></svg>">
  
  <!-- Bootstrap 5 CSS e Iconos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  
  <!-- Leaflet CSS (Mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body {
      background-color: #f8f9fa;
    }
    .header-banner {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: white;
    }
    /* Estilo obligatorio para que Leaflet muestre el mapa */
    #map {
      width: 100%;
      height: 350px;
      border-radius: 8px;
      z-index: 1;
    }
    .card-incidencia {
      border: none;
      border-radius: 10px;
    }
    .badge-estado {
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO -->
  <header class="header-banner p-3 p-sm-4 shadow-sm mb-3">
    <div class="container" style="max-width: 720px;">
      <div class="d-flex justify-content-end mb-2">
        <button id="btn-auth-header" class="btn btn-sm btn-outline-light rounded-pill" data-bs-toggle="modal" data-bs-target="#modalLogin">
          <i class="bi bi-person-lock"></i> Acceso Admin
        </button>
      </div>
      <div class="text-center">
        <h3 class="fw-bold mb-1 fs-4 fs-md-3"><i class="bi bi-geo-alt-fill text-warning"></i> Incidencias Sánchez Taboada</h3>
        <p class="small text-white-50 mb-0">Plataforma ciudadana para el reporte y seguimiento comunitario</p>
      </div>
    </div>

    <!-- Botón del buzón de revisión (Oculto por defecto con d-none) -->
<button id="btn-buzon-admin" class="btn btn-warning btn-sm d-none me-2" data-bs-toggle="modal" data-bs-target="#modalBuzonAdmin">
  <i class="bi bi-inbox-fill"></i> Por Revisar <span id="badge-pendientes-admin" class="badge bg-danger">0</span>
</button>

<!-- Modal / Ventana del Buzón de Revisión para Admin -->
<div class="modal fade" id="modalBuzonAdmin" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title"><i class="bi bi-shield-check me-2"></i> Reportes Pendientes de Revisión</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="container-buzon-admin">
        <!-- Aquí se cargan dinámicamente las incidencias en revisión -->
      </div>
    </div>
  </div>
</div>
  </header>

  

  <main class="container mb-5" style="max-width: 720px;">

    <!-- PANEL DE CONTADORES -->
    <div class="row g-2 mb-4 text-center">
      <div class="col-4">
        <div class="bg-white p-2 p-sm-3 rounded shadow-sm border">
          <span class="d-block text-muted small fw-semibold">Pendientes</span>
          <span id="cant-pendientes" class="fs-4 fw-bold text-warning">0</span>
        </div>
      </div>
      <div class="col-4">
        <div class="bg-white p-2 p-sm-3 rounded shadow-sm border">
          <span class="d-block text-muted small fw-semibold">En revisión</span>
          <span id="cant-revision" class="fs-4 fw-bold text-info">0</span>
        </div>
      </div>
      <div class="col-4">
        <div class="bg-white p-2 p-sm-3 rounded shadow-sm border">
          <span class="d-block text-muted small fw-semibold">Atendidos</span>
          <span id="cant-atendidos" class="fs-4 fw-bold text-success">0</span>
        </div>
      </div>
    </div>

    <!-- FORMULARIO DE REGISTRO DE INCIDENCIA -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white fw-bold py-3">
        <i class="bi bi-plus-circle-fill text-primary"></i> Reportar una nueva incidencia
      </div>
      <div class="card-body">
        <form id="form-incidencia" onsubmit="crearIncidencia(event)">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Título del reporte *</label>
            <input type="text" id="inc-titulo" class="form-control" placeholder="Ej. Fuga de agua en Av. Las Torres" required>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-sm-6">
              <label class="form-label small fw-semibold">Tipo de Incidencia *</label>
              <select id="inc-tipo" class="form-select" required>
                <option value="" selected disabled>Seleccionar tipo...</option>
                <option value="Grieta / Deslizamiento">Grieta / Deslizamiento</option>
                <option value="Fuga de Agua">Fuga de Agua</option>
                <option value="Fuga de Agua">Corte de luz</option>
                <option value="Alumbrado Público">Alumbrado Público</option>
                <option value="Bacheo / Vialidad">Bacheo / Vialidad</option>
                <option value="Acumulación de Basura">Acumulación de Basura</option>
                <option value="Seguridad / Otro">Seguridad / Otro</option>
              </select>
            </div>
            <div class="col-sm-6">
              <label class="form-label small fw-semibold">Ubicación / Calle *</label>
              <input type="text" id="inc-ubicacion" class="form-control" placeholder="Ej. Calle Ameca #123" required>
            </div>
          </div>

          <!-- MAPA LEAFLET -->
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label small fw-semibold mb-0">Marcar ubicación exacta en el mapa (Opcional)</label>
              <button type="button" class="btn btn-sm btn-outline-primary py-0" onclick="usarUbicacionActual()">
                <i class="bi bi-crosshair"></i> Mi ubicación
              </button>
            </div>
            <div id="map"></div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Descripción del problema *</label>
            <textarea id="inc-descripcion" class="form-control" rows="3" placeholder="Describe el problema..." required></textarea>
          </div>

          <!-- FOTOGRAFÍA DE EVIDENCIA -->
          <div class="mb-3">
            <label class="form-label small fw-semibold">Fotografía de evidencia (Opcional)</label>
            <input type="file" id="inc-file" class="form-control" accept="image/*" onchange="previsualizarImagen(event)">
            <div id="preview-container" class="mt-2 position-relative d-none">
              <img id="img-preview" src="" class="img-fluid rounded border" style="max-height: 200px; width: 100%; object-fit: cover;">
              <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0 m-2 rounded-circle" onclick="cancelarFoto()">
                <i class="bi bi-x-lg"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="btn-guardar" class="btn btn-primary w-100 fw-bold">Enviar Reporte</button>
        </form>
      </div>
    </div>

    <!-- LISTADO DE INCIDENCIAS -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0"><i class="bi bi-list-stars"></i> Reportes Recientes</h5>
      <button class="btn btn-sm btn-outline-secondary" onclick="cargarIncidencias()"><i class="bi bi-arrow-clockwise"></i> Actualizar</button>
    </div>
    
    <div id="incidencias-container">
      <div class="text-center py-4 text-muted">Cargando reportes registrados...</div>
    </div>

    <!-- PAGINACIÓN -->
    <div id="paginacion-controls" class="d-flex justify-content-between align-items-center mt-3 d-none">
      <button id="btn-prev" class="btn btn-sm btn-outline-secondary" onclick="cambiarPagina(-1)">Anterior</button>
      <span id="info-pagina" class="small text-muted">Página 1</span>
      <button id="btn-next" class="btn btn-sm btn-outline-secondary" onclick="cambiarPagina(1)">Siguiente</button>
    </div>

  </main>

  <!-- MODAL LOGIN ADMIN -->
  <div class="modal fade" id="modalLogin" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content border-0 shadow">
        <div class="modal-header">
          <h6 class="modal-title fw-bold"><i class="bi bi-lock-fill"></i> Acceso Admin</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="form-login" onsubmit="event.preventDefault(); iniciarSesion();">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Correo electrónico</label>
              <input type="email" id="login-email" class="form-control form-control-sm" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Contraseña</label>
              <input type="password" id="login-password" class="form-control form-control-sm" required>
            </div>
            <button type="submit" id="btn-login" class="btn btn-primary btn-sm w-100 fw-bold">Iniciar Sesión</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- LIBRERÍAS (Cargadas en orden estricto) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- SCRIPT PRINCIPAL -->
  <script src="script.js"></script>
</body>
</html>
