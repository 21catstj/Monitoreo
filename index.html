<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte de Incidencias - Sánchez Taboada</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; padding-bottom: 3rem; }
    .header-banner { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; border-radius: 0 0 16px 16px; }
    .card-incidencia { border: none; border-radius: 12px; transition: transform 0.2s; }
    .card-incidencia:hover { transform: translateY(-2px); }
    .preview-container { position: relative; display: inline-block; }
    .preview-container img { max-height: 150px; border-radius: 8px; object-fit: cover; }
    .btn-remove-preview { position: absolute; top: -5px; right: -5px; border-radius: 50%; padding: 2px 6px; font-size: 0.75rem; }
    .badge-estado { font-size: 0.75rem; padding: 6px 10px; border-radius: 20px; }
  </style>
</head>
<body>

  <!-- Encabezado de la App -->
  <header class="header-banner p-4 shadow-sm mb-4 text-center">
    <div class="container" style="max-width: 720px;">
      <h3 class="fw-bold mb-1"><i class="bi bi-geo-alt-fill text-warning"></i> Incidencias Sánchez Taboada</h3>
      <p class="small text-white-50 mb-0">Plataforma ciudadana para el reporte y seguimiento de problemas comunitarios</p>
    </div>
  </header>

  <div class="container" style="max-width: 720px;">

    <!-- Formulario para Registrar Nueva Incidencia -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body p-4">
        <h5 class="fw-bold card-title mb-3 text-primary"><i class="bi bi-plus-circle-fill"></i> Reportar Nueva Incidencia</h5>
        
        <form id="form-incidencia" onsubmit="event.preventDefault(); crearIncidencia();">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Título del problema</label>
            <input type="text" id="inc-titulo" class="form-control" placeholder="Ej: Fuga de agua potable / Grieta en vialidad" required>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Tipo de Incidencia</label>
              <select id="inc-tipo" class="form-select" required>
                <option value="" selected disabled>Selecciona una categoría...</option>
                <option value="Grieta / Deslizamiento">Grieta / Deslizamiento</option>
                <option value="Fuga de Agua">Fuga de Agua</option>
                <option value="Alumbrado Público">Alumbrado Público</option>
                <option value="Bacheo / Vialidad">Bacheo / Vialidad</option>
                <option value="Acumulación de Basura">Acumulación de Basura</option>
                <option value="Seguridad / Otro">Seguridad / Otro</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Ubicación / Referencia</label>
              <input type="text" id="inc-ubicacion" class="form-control" placeholder="Calle, sección o punto de referencia" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Descripción detallada</label>
            <textarea id="inc-descripcion" class="form-control" rows="3" placeholder="Añade detalles sobre la gravedad, el tiempo que lleva el problema, etc." required></textarea>
          </div>

          <!-- Previsualización de Imagen -->
          <div id="image-preview-wrapper" class="mb-3 d-none">
            <div class="preview-container">
              <img id="image-preview" src="" alt="Evidencia">
              <button type="button" class="btn btn-danger btn-remove-preview" onclick="cancelarFoto()"><i class="bi bi-x-lg"></i></button>
            </div>
          </div>

          <input type="file" id="inc-file" accept="image/*" class="d-none" onchange="mostrarVistaPrevia(event)">

          <div class="d-flex justify-content-between align-items-center pt-2 border-top">
            <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" onclick="document.getElementById('inc-file').click()">
              <i class="bi bi-camera-fill"></i> Adjuntar Fotografía
            </button>
            <button type="submit" id="btn-guardar" class="btn btn-primary btn-sm px-4 rounded-pill fw-bold">
              Enviar Reporte
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Filtros y Listado -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0">Reportes Recientes</h5>
      <button class="btn btn-sm btn-outline-primary" onclick="cargarIncidencias()"><i class="bi bi-arrow-clockwise"></i> Actualizar</button>
    </div>

    <!-- Contenedor donde se cargan las incidencias -->
    <div id="incidencias-container">
      <div class="text-center py-4 text-muted">Cargando reportes registrados...</div>
    </div>

  </div>

  <!-- SDK de Supabase & Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Archivo Lógico del Proyecto -->
  <script src="scrip.js"></script>
</body>
</html>
