<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte de Incidencias - Sánchez Taboada</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; padding-bottom: 3rem; }
    .header-banner { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; border-radius: 0 0 16px 16px; position: relative; }
    .card-incidencia { border: none; border-radius: 12px; }
    .preview-container { position: relative; display: inline-block; }
    .preview-container img { max-height: 150px; border-radius: 8px; object-fit: cover; }
    .btn-remove-preview { position: absolute; top: -5px; right: -5px; border-radius: 50%; padding: 2px 6px; font-size: 0.75rem; }
    .badge-estado { font-size: 0.78rem; padding: 6px 12px; border-radius: 20px; }
    #mapa-formulario { height: 280px; border-radius: 10px; width: 100%; z-index: 1; }
  </style>
</head>
<body>

<header class="header-banner p-3 p-sm-4 shadow-sm mb-3">
    <div class="container" style="max-width: 720px;">
      <!-- Fila superior para el botón de acceso (sin position-absolute) -->
      <div class="d-flex justify-content-end mb-2">
        <button id="btn-auth-header" class="btn btn-sm btn-outline-light rounded-pill" data-bs-toggle="modal" data-bs-target="#modalLogin">
          <i class="bi bi-person-lock"></i> Acceso Admin
        </button>
      </div>

      <!-- Título y descripción centrados con tamaño adaptable -->
      <div class="text-center">
        <h3 class="fw-bold mb-1 fs-4 fs-md-3"><i class="bi bi-geo-alt-fill text-warning"></i> Incidencias Sánchez Taboada</h3>
        <p class="small text-white-50 mb-0">Plataforma ciudadana para el reporte y seguimiento de problemas comunitarios</p>
      </div>
    </div>
  </header>

  <!-- Contadores resumidos -->
  <div class="container mb-4" style="max-width: 720px;">
    <div class="row g-2 text-center">
      <div class="col-4">
        <div class="card border-0 shadow-sm bg-warning bg-opacity-10 py-2">
          <span class="text-warning-emphasis fw-bold fs-4 mb-0" id="cant-pendientes">0</span>
          <span class="small text-muted fw-semibold">Pendientes</span>
        </div>
      </div>
      <div class="col-4">
        <div class="card border-0 shadow-sm bg-info bg-opacity-10 py-2">
          <span class="text-info-emphasis fw-bold fs-4 mb-0" id="cant-revision">0</span>
          <span class="small text-muted fw-semibold">En Revisión</span>
        </div>
      </div>
      <div class="col-4">
        <div class="card border-0 shadow-sm bg-success bg-opacity-10 py-2">
          <span class="text-success fw-bold fs-4 mb-0" id="cant-atendidos">0</span>
          <span class="small text-muted fw-semibold">Atendidos</span>
        </div>
      </div>
    </div>
  </div>

  <div class="container" style="max-width: 720px;">

    <!-- Formulario para Registrar Nueva Incidencia -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body p-4">
        <h5 class="fw-bold card-title mb-3 text-primary"><i class="bi bi-plus-circle-fill"></i> Reportar Nueva Incidencia</h5>
        
        <form id="form-incidencia" onsubmit="event.preventDefault(); crearIncidencia();">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Título del problema</label>
            <input type="text" id="inc-titulo" class="form-control" placeholder="Ej: Fuga de agua / Deslizamiento" required>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Tipo de Incidencia</label>
              <select id="inc-tipo" class="form-select" required>
                <option value="" selected disabled>Selecciona una categoría...</option>
                <option value="Grieta / Deslizamiento">Grieta / Deslizamiento</option>
                <option value="Fuga de Agua">Fuga de Agua</option>
                <option value="Alumbrado Público">Alumbrado Público</option>
                <option value="Bacheo / Vialidad">Bacheo / Vialidad</option>
                <option value="Acumulación de Basura">Acumulación de Basura</option>
                <option value="Seguridad / Otro">Seguridad / Otro</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Ubicación / Referencia escrita</label>
              <input type="text" id="inc-ubicacion" class="form-control" placeholder="Calle o punto de referencia" required>
            </div>
          </div>

          <!-- Mapa con GPS -->
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label small fw-semibold mb-0"><i class="bi bi-pin-map-fill text-danger"></i> Ubicación exacta en el mapa:</label>
              <button type="button" id="btn-gps" class="btn btn-outline-primary btn-sm py-1 px-2 rounded-pill" style="font-size: 0.78rem;" onclick="obtenerUbicacionGPS()">
                <i class="bi bi-crosshair"></i> Usar mi ubicación actual (GPS)
              </button>
            </div>
            <div id="mapa-formulario" class="border"></div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Descripción detallada</label>
            <textarea id="inc-descripcion" class="form-control" rows="3" placeholder="Detalles de la gravedad o tiempo que lleva el problema..." required></textarea>
          </div>

          <!-- Previsualización de Imagen -->
          <div id="image-preview-wrapper" class="mb-3 d-none">
            <div class="preview-container">
              <img id="image-preview" src="" alt="Evidencia">
              <button type="button" class="btn btn-danger btn-remove-preview" onclick="cancelarFoto()"><i class="bi bi-x-lg"></i></button>
            </div>
          </div>

          <input type="file" id="inc-file" accept="image/*" class="d-none" onchange="mostrarVistaPrevia(event)">

          <div class="d-flex justify-content-between align-items-center pt-2 border-top">
            <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" onclick="document.getElementById('inc-file').click()">
              <i class="bi bi-camera-fill"></i> Adjuntar Fotografía
            </button>
            <button type="submit" id="btn-guardar" class="btn btn-primary btn-sm px-4 rounded-pill fw-bold">
              Enviar Reporte
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Lista de Reportes -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0">Reportes Recientes</h5>
      <button class="btn btn-sm btn-outline-primary" onclick="cargarIncidencias()"><i class="bi bi-arrow-clockwise"></i> Actualizar</button>
    </div>

    <div id="incidencias-container">
      <div class="text-center py-4 text-muted">Cargando reportes registrados...</div>
    </div>

    <!-- Paginador -->
    <div class="d-flex justify-content-between align-items-center my-4" id="paginacion-controls">
      <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" id="btn-prev" onclick="cambiarPagina(-1)"><i class="bi bi-chevron-left"></i> Anterior</button>
      <span class="small text-muted fw-semibold" id="info-pagina">Página 1</span>
      <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" id="btn-next" onclick="cambiarPagina(1)">Siguiente <i class="bi bi-chevron-right"></i></button>
    </div>

  </div>

  <!-- Modal de Inicio de Sesión para Administradores -->
  <div class="modal fade" id="modalLogin" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-bottom-0 pb-0">
          <h6 class="modal-title fw-bold"><i class="bi bi-shield-lock-fill text-primary"></i> Iniciar Sesión Autorizada</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form onsubmit="event.preventDefault(); iniciarSesion();">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Correo Electrónico</label>
              <input type="email" id="login-email" class="form-control form-control-sm" required placeholder="admin@ejemplo.com">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Contraseña</label>
              <input type="password" id="login-password" class="form-control form-control-sm" required placeholder="••••••••">
            </div>
            <button type="submit" id="btn-login-submit" class="btn btn-primary btn-sm w-100 rounded-pill fw-bold">Ingresar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de Edición de Incidencia -->
<div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header">
        <h6 class="modal-title fw-bold"><i class="bi bi-pencil-square text-primary"></i> Editar Incidencia</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="form-editar" onsubmit="event.preventDefault(); guardarEdicion();">
          <input type="hidden" id="edit-id">
          
          <div class="mb-3">
            <label class="form-label small fw-semibold">Título</label>
            <input type="text" id="edit-titulo" class="form-control form-control-sm" required>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label small fw-semibold">Tipo de Incidencia</label>
              <select id="edit-tipo" class="form-select form-select-sm" required>
                <option value="Grieta / Deslizamiento">Grieta / Deslizamiento</option>
                <option value="Fuga de Agua">Fuga de Agua</option>
                <option value="Alumbrado Público">Alumbrado Público</option>
                <option value="Bacheo / Vialidad">Bacheo / Vialidad</option>
                <option value="Acumulación de Basura">Acumulación de Basura</option>
                <option value="Seguridad / Otro">Seguridad / Otro</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label small fw-semibold">Ubicación</label>
              <input type="text" id="edit-ubicacion" class="form-control form-control-sm" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Descripción</label>
            <textarea id="edit-descripcion" class="form-control form-control-sm" rows="3" required></textarea>
          </div>

          <div class="d-flex justify-content-end gap-2 pt-2 border-top">
            <button type="button" class="btn btn-secondary btn-sm rounded-pill" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" id="btn-guardar-edit" class="btn btn-primary btn-sm rounded-pill fw-bold">Guardar Cambios</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="scrip.js"></script>
</body>
</html>
